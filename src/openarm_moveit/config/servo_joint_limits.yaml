# MoveIt Servo 전용 관절 한계. Servo 는 매 주기 Jacobian 역행렬로 관절 속도를 푸는데,
# 특이자세 근처에서 그 값이 커진다. 관절 속도 상한을 낮게 두면 그 순간에도 팔이 튀지 않고,
# 관절 한계 앞에서 멈추는 거리(v²/2a)도 joint_limit_margins 안에 들어온다.
